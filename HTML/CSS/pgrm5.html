<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style type="text/css">
        #head1
        {
            color:violet;
        }
        #head2
        {
            color:pink;
        }
        #head3
        {
            color: purple;
        }

    </style>
</head>
<body>
    <h2>condition: don't use inline in css</h2>
    <h2>id attribute: we can apply different styles for name tag</h2>
    <h1 id="head1">this s a violet color </h1>
    <h1 id="head2">this is a pink color</h1>
    <h1 id="head3">this is a purple color</h1>
    
</body>
</html>
