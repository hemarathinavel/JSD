<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style type="text/css">
        div,img
        {
            width: 500px;
            height: 500px;
            border-radius: 25%;
            background-color: red;
            border: 50px dotted green;
            position:relative;
            animation-name: kalvi;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
            animation-duration: 1s;

            animation-delay: 0s;
            animation-direction: alternate;
        }
        @keyframes kalvi
        {
            0%{
                left: 0px;top: 0px;
            }
            40%{
                left:500px;
                top: 200px;
                transform: rotate(360deg);
            }
            70%{
                left: 1000px;
                top: 100px;
                transform: rotate(360deg);
            }
            100%{
                left: 1500px;
                top: 40px;
                transform: rotate(360deg);
            }

        }
    </style>
    
</head>
<body>
    <div>

    </div>
    <img src="./images/shin Chan.jfif" >
    <img src="./images/Shinchan.jfif" >
    
</body>
</html>
