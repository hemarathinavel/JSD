# Server
server.port=8080

# H2 file-based database (data survives app restarts; file created under ./data)
spring.datasource.url=jdbc:h2:file:./data/taskdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 console (visit http://localhost:8080/h2-console while the app is running)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Return a clean JSON error body instead of a Whitelabel HTML error page
server.error.include-message=always
server.error.include-binding-errors=always
