<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Google Sheet API Demo</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 10px 20px; cursor: pointer; }
    pre { background: #f4f4f4; padding: 12px; border-radius: 6px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>Google Sheet API Demo</h1>

  <h2>Submit Data</h2>
  <form id="dataForm" onsubmit="handleFormSubmit(event)">
    <label for="name">Name</label>
    <input type="text" id="name" required />

    <label for="email">Email</label>
    <input type="email" id="email" required />

    <label for="message">Message</label>
    <textarea id="message" rows="3" required></textarea>

    <button type="submit">Submit</button>
  </form>

  <h2>Sheet Data (GET)</h2>
  <button onclick="loadData()">Refresh Data</button>
  <pre id="output">Loading...</pre>

  <script src="script.js"></script>
</body>
</html>
