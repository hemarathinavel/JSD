<!doctype html><html><head><meta charset="UTF-8"><title>GenChat</title><style>body{font-family:Arial;max-width:760px;margin:40px auto;padding:20px;background:#f4f6f8}section{background:white;padding:20px;border-radius:12px;margin-bottom:18px}input,button{padding:10px;margin:5px 0}#messages{height:300px;overflow:auto;border:1px solid #ddd;padding:10px}.msg{padding:8px;border-bottom:1px solid #eee}</style></head><body><h1>💬 GenChat</h1><section><h3>Register</h3><input id="ru" placeholder="Username"><input id="rp" type="password" placeholder="Password"><button onclick="register()">Register</button><p id="reg"></p></section><section><h3>Login & Chat</h3><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button onclick="load()">Login / Load</button><div id="messages"></div><input id="text" placeholder="Message" style="width:75%"><button onclick="send()">Send</button></section><script>let auth='';async function register(){let r=await fetch('/api/users/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:ru.value,password:rp.value})});reg.textContent=await r.text()}async function load(){auth='Basic '+btoa(u.value+':'+p.value);let r=await fetch('/api/messages',{headers:{Authorization:auth}});if(!r.ok){messages.innerHTML='Login failed';return}let a=await r.json();messages.innerHTML=a.map(x=>`<div class="msg"><b>${x.sender}</b>: ${x.content}</div>`).join('')}async function send(){if(!auth)return;await fetch('/api/messages',{method:'POST',headers:{Authorization:auth,'Content-Type':'application/json'},body:JSON.stringify({content:text.value})});text.value='';load()}</script></body></html>
