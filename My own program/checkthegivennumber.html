<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        function positiveornegativeorzero()
        {
            var n=parseInt(document.getElementById("t1").value);
            
        if(n>0)
        {
            document.getElementById("Result").innerHTML=n+"is Positive";
        }
        else if(n<0)
        {
            document.getElementById("Result").innerHTML=n+"is Negative";
        }
        else
        {
            document.getElementById("Result").innerHTML=n+"is Zero";
        }
        }
    </script>
</head>
<body>
    <input type="text" id="t1" placeholder="Enter no 1">
    <br>
    <input type="button" value="Positive or Negative or Zero" onclick="positiveornegativeorzero()">
    <br>
    <div id="Result"></div>
    
</body>
</html>
