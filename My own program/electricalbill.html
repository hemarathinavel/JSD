<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        function electricityBill()
        {
            var n = parseInt(document.getElementById("t1").value);
        if(n<=100)
        {
            var bill = n * 2;
            document.getElementById("Result").innerHTML = n + " units = ₹" + bill;
        }
        else if(n<=200)
        {
            var bill=n*3;
            document.getElementById("Result").innerHTML=n + " units = ₹" + bill;
        }
        else
        {
            var bill=n*5 ;
            document.getElementById("Result").innerHTML=n + " units = ₹" + bill;
        }
        }

    </script>
</head>
<body>
    <input type="text" id="t1" placeholder="Enter units">
<br>
<input type="button" value="Calculate Bill" onclick="electricityBill()">
<br>
<div id="Result"></div>
</body>
</html>
