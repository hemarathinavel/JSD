<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        function greatest()
        {
            var n1=parseInt(document.getElementById("t1").value);
            var n2=parseInt(document.getElementById("t2").value);
            var n3=parseInt(document.getElementById("t3").value);
            if(n1>n2 && n1>n3)
            {
                document.getElementById("Result").innerHTML=n1+"is greatest";

            }
            else if(n2>n3)
            {
                document.getElementById("Result").innerHTML=n2+"is greatest";
            }
            else
            {
                document.getElementById("Result").innerHTML=n3+"is greatest";
            }
        }
    </script>
</head>
<body>
    <input type="text" id="t1" placeholder="Enter no 1">
    <br>
    <input type="text" id="t2" placeholder="Enter no 2">
    <br>
    <input type="text" id="t3" placeholder="Enter no 3">
    <br>
    <input type="button" value="Greatest" onclick="greatest()">
    <br>
    <div id="Result"></div>
    
</body>
</html>
