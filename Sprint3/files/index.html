<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Board</title>

  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="board-header">
    <div class="container">
      <h1 class="board-header__title">Task Board</h1>
      <p class="board-header__subtitle">Add a task, track it through TODO, IN PROGRESS, REVIEW and DONE.</p>
    </div>
  </header>

  <main class="container board-main">
    <div class="row g-4">

      <!-- Task Form -->
      <section class="col-lg-5">
        <div class="card task-form-card">
          <div class="card-body">
            <h2 class="section-heading">New task</h2>

            <form id="taskForm" novalidate>

              <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input
                  type="text"
                  class="form-control"
                  id="name"
                  name="name"
                  placeholder="e.g. Set up database schema"
                  required
                />
                <div class="invalid-feedback">Enter a task name.</div>
              </div>

              <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea
                  class="form-control"
                  id="description"
                  name="description"
                  rows="3"
                  placeholder="What needs to be done?"
                  required
                ></textarea>
                <div class="invalid-feedback">Enter a description so the assignee knows what to do.</div>
              </div>

              <div class="mb-3">
                <label for="assignedTo" class="form-label">Assigned To</label>
                <input
                  type="text"
                  class="form-control"
                  id="assignedTo"
                  name="assignedTo"
                  placeholder="e.g. Hema"
                  required
                />
                <div class="invalid-feedback">Enter who this task is assigned to.</div>
              </div>

              <div class="mb-3">
                <label for="dueDate" class="form-label">Due Date</label>
                <input
                  type="date"
                  class="form-control"
                  id="dueDate"
                  name="dueDate"
                  required
                />
                <div class="invalid-feedback">Choose a due date.</div>
              </div>

              <div class="mb-4">
                <label for="status" class="form-label">Status</label>
                <select class="form-select" id="status" name="status" required>
                  <option value="" selected disabled>Choose a status</option>
                  <option value="TODO">TODO</option>
                  <option value="IN PROGRESS">IN PROGRESS</option>
                  <option value="REVIEW">REVIEW</option>
                  <option value="DONE">DONE</option>
                </select>
                <div class="invalid-feedback">Select a status for this task.</div>
              </div>

              <button type="submit" id="submitBtn" class="btn btn-primary w-100">Add task</button>
              <p class="form-hint">Click any task card to edit it.</p>
            </form>
          </div>
        </div>
      </section>

      <!-- Task List -->
      <section class="col-lg-7">
        <h2 class="section-heading">Tasks</h2>
        <ul class="list-group task-list" id="taskList">
          <!-- Task cards are rendered here by js/script.js -->
        </ul>
      </section>

    </div>
  </main>

  <template id="taskCardTemplate">
    <li class="list-group-item task-list__item">
      <div class="card task-card">
        <div class="card-body">
          <div class="task-card__top">
            <h3 class="task-card__name"></h3>
            <span class="badge task-card__status"></span>
          </div>
          <p class="task-card__description"></p>
          <div class="task-card__meta">
            <span class="task-card__assigned"></span>
            <span class="task-card__due"></span>
          </div>
          <button type="button" class="btn btn-outline-danger btn-sm task-card__delete">
            Delete
          </button>
        </div>
      </div>
    </li>
  </template>

  <script src="js/classes.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
