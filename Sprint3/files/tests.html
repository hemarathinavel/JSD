<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Board — Unit Tests</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />

  <style>
    .test-summary {
      font-weight: 600;
      margin-bottom: 0.75rem;
    }
    .test-result {
      list-style: none;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      margin-bottom: 0.4rem;
      font-family: monospace;
      font-size: 0.85rem;
    }
    .test-result--pass {
      background: #e6f4ea;
      color: #15803d;
    }
    .test-result--fail {
      background: #fdecea;
      color: #b91c1c;
    }
    #testResults {
      padding-left: 0;
    }
    /* Hide the normal app UI — tests run against it, but we don't need to see it */
    .board-header,
    .board-main {
      display: none;
    }
  </style>
</head>
<body>

  <main class="container board-main" style="display:block; padding-top:2.5rem; padding-bottom:4rem;">
    <h1 class="board-header__title">Task Board — Unit Tests</h1>
    <p class="board-header__subtitle" style="margin-bottom:2rem;">
      Open this page in a browser (or the console) to run the test suite.
    </p>
    <ul id="testResults"></ul>
  </main>

  <!-- The real app markup, kept in the page (hidden) so tests.js can drive it -->
  <div style="display:none;">
    <form id="taskForm" novalidate>
      <input type="text" id="name" name="name" required />
      <textarea id="description" name="description" required></textarea>
      <input type="text" id="assignedTo" name="assignedTo" required />
      <input type="date" id="dueDate" name="dueDate" required />
      <select id="status" name="status" required>
        <option value="" selected disabled></option>
        <option value="TODO">TODO</option>
        <option value="IN PROGRESS">IN PROGRESS</option>
        <option value="REVIEW">REVIEW</option>
        <option value="DONE">DONE</option>
      </select>
      <button type="submit" id="submitBtn">Add task</button>
    </form>

    <ul id="taskList"></ul>

    <template id="taskCardTemplate">
      <li class="list-group-item task-list__item">
        <div class="card task-card">
          <div class="card-body">
            <div class="task-card__top">
              <h3 class="task-card__name"></h3>
              <span class="badge task-card__status"></span>
            </div>
            <p class="task-card__description"></p>
            <div class="task-card__meta">
              <span class="task-card__assigned"></span>
              <span class="task-card__due"></span>
            </div>
            <button type="button" class="btn btn-outline-danger btn-sm task-card__delete">
              Delete
            </button>
          </div>
        </div>
      </li>
    </template>
  </div>

  <script>
    // Start every test run from a clean slate.
    localStorage.removeItem("sac_task_board_tasks");
  </script>
  <script src="js/classes.js"></script>
  <script src="js/script.js"></script>
  <script src="js/tests.js"></script>
</body>
</html>
