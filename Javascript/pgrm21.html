<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        function dis()
        {
            var data=document.getElementById("t1").value;
            var re=/^[A-Z]{4,12}$/;
            if(data.match(re))
            alert("valid");
            else
            alert("invalid format")
        }
    </script>
</head>
<body>
    <h1> Regular expression Name validation(only caps,min:4,max:12)</h1>
    <input type="text" id="t1" placeholder="Enter Your name">
    <br>
    <input type="button" value="validate" onclick="dis()">
    <br>
    <div id="res"></div>
    
</body>
</html>
