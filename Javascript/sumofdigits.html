<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
    function sumofdigits()
    {
            var n=parseInt(document.getElementById("t1").value);
            var sum=0;
        
        while(n>0)
        {
            var digit= n% 10;
            sum=sum + digit;
             n=Math.floor(n/10);
        }
        document.getElementById("result").innerHTML=sum;
    }
    </script>
</head>
<body>
    <input type="text" id="t1" placeholder="Enter a number">
    <br>
    <input type="button" value="Calculate" onclick="sumofdigits()">
    <br>
    <div id="result"></div>
</body>
</html>
