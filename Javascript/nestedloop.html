<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        function dis()
        {
            var n=document.getElementById("t1").value;
            for(var i=1;i<=n;i++)
            {
                for(var j=1;j<=n;j++)
                {
                    document.write(" "+i+j);
                }
                document.write("<br>");
            }
            
        }
    </script>
</head>
<body>
    <input type="number" placeholder="enter number" id="t1">
    <br>
    <button onclick="dis()">nested loop</button>
</body>
</html>
