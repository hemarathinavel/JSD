<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
         function findres()
    {
        var m1=parseInt(document.getElementById("t1").value);
        var m2=parseInt(document.getElementById("t2").value);
        var m3=parseInt(document.getElementById("t3").value);
        var m4=parseInt(document.getElementById("t4").value);
        var m5=parseInt(document.getElementById("t5").value);
        var tot=m1+m2+m3+m4+m5;
        var per=tot/5.0;
        var res="";
        var gra="";
    

    if(m1>34 && m2>34 && m3>34 && m4>34 && m5>34)
    {
        res="PASS";
        if(per>90)
        gra="Outstanding";
        else if(per>=80)
        gra="excellent";
        else if(per>=70)
        gra="good";
        else if(per>=60)
        gra="fair";
        else
        gra="need to improve";

    }
    else
    {
        res="FAIL";
        gra="no grade because fail";
    }
    if(res=="PASS")
    {
         document.getElementById("r1").innerHTML="<font color='green'>Total:"+tot;
         document.getElementById("r2").innerHTML="<font color='green'>Percentage:"+per;
         document.getElementById("r3").innerHTML="<font color='green'>Result:"+res;
        document.getElementById("r4").innerHTML="<font color='green'>Grade:"+gra;


    }
    else
        {
            document.getElementById("r1").innerHTML="<font color='red'>Total:"+tot;
            document.getElementById("r2").innerHTML="<font color='red'>Percentage:"+per;
            document.getElementById("r3").innerHTML="<font color='red'>Result:"+res;
            document.getElementById("r4").innerHTML="<font color='red'>Grade:"+gra;



        }
    }
    </script>
</head>
<body>
    <input type="text" id="t1" placeholder="Enter Mark1:"><br>
    <input type="text" id="t2" placeholder="Enter Mark2:"><br>
    <input type="text" id="t3" placeholder="Enter Mark3:"><br>
    <input type="text" id="t4" placeholder="Enter Mark4:"><br>
    <input type="text" id="t5" placeholder="Enter Mark5:"><br>
    <input type="button" value="result"onclick="findres()"><br>
    <div id="r1"></div>
    <div id="r2"></div>
    <div id="r3"></div>
    <div id="r4"></div>
    
    
</body>
</html>
