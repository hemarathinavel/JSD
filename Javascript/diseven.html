<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Even Numbers</title>
    <script type="text/javascript">
        function even()
        {
            var n=parseInt(document.getElementById("t1").value);
            var res="";
            while(n>0)
            {
                var digit=n%10;
                if(digit % 2==0)
                {
                    res=digit+res;
                }
                n=Math.floor(n/10);
            }
            document.getElementById("result").innerHTML=res;
        }

    </script>
</head>
<body>
    <input type="text" id="t1" placeholder="Enter a number">
    <br>
    <input type="button" value="display" onclick="even()">
    <br>
    <div id="result"></div>
    
</body>
</html>
