<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prime Check</title>
    <script type="text/javascript">
        function prime() {
            var n1 = parseInt(document.getElementById("t1").value);
            var isPrime = true;

            if (n1 < 2) {
                isPrime = false;
            }

            for (var i = 2; i < n1; i++) {
                if (n1 % i == 0) {
                    isPrime = false;
                }
            }

            var res = isPrime ? "Prime Number" : "not prime number";
            document.getElementById("ans").innerHTML = res;
        }
    </script>
</head>
<body>
    <input type="text" id="t1" placeholder="Enter a number">
    <br>
    <input type="button" value="showanswer" onclick="prime()">
    <br>
    <div id="ans"></div>
</body>
</html>
