<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebDev Quiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar quiz-nav">
  <div class="container">
    <span class="navbar-brand fw-bold">WebDev Quiz</span>
    <span class="badge best-badge">Best score: <span id="bestScore">0</span></span>
  </div>
</nav>

<main class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-7 col-md-9">

      <!-- Start screen -->
      <section id="startScreen" class="quiz-card text-center">
        <h1 class="display-6 fw-bold mb-2">Test your web development basics</h1>
        <p class="text-muted mb-4">10 questions on HTML, CSS, JavaScript and Bootstrap. You get 20 seconds for each question.</p>
        <div class="mb-3 text-start">
          <label for="playerName" class="form-label fw-semibold">Your name</label>
          <input type="text" id="playerName" class="form-control form-control-lg" placeholder="Enter your name" maxlength="25">
          <div id="nameError" class="text-danger small mt-1 d-none">Please enter your name to start.</div>
        </div>
        <div class="mb-4 text-start">
          <label for="category" class="form-label fw-semibold">Topic</label>
          <select id="category" class="form-select form-select-lg">
            <option value="All">All topics</option>
            <option value="HTML">HTML</option>
            <option value="CSS">CSS</option>
            <option value="JavaScript">JavaScript</option>
            <option value="Bootstrap">Bootstrap</option>
          </select>
        </div>
        <button id="startBtn" class="btn btn-accent btn-lg w-100">Start quiz</button>
      </section>

      <!-- Question screen -->
      <section id="quizScreen" class="quiz-card d-none">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <span class="fw-semibold">Question <span id="qNumber">1</span> of <span id="qTotal">10</span></span>
          <span class="timer" id="timer" aria-live="polite">20s</span>
        </div>
        <div class="progress mb-4" role="progressbar" aria-label="Quiz progress">
          <div id="progressBar" class="progress-bar" style="width:0%"></div>
        </div>
        <h2 id="questionText" class="h4 mb-4"></h2>
        <div id="options" class="d-grid gap-2 mb-3"></div>
        <div id="feedback" class="alert d-none" role="status"></div>
        <button id="nextBtn" class="btn btn-accent w-100 d-none">Next question</button>
      </section>

      <!-- Result screen -->
      <section id="resultScreen" class="quiz-card text-center d-none">
        <h2 class="fw-bold" id="resultTitle"></h2>
        <div class="score-circle mx-auto my-4"><span id="finalScore">0</span><small>/<span id="finalTotal">10</span></small></div>
        <p id="resultMsg" class="text-muted"></p>
        <div class="row g-2 mb-4 text-center">
          <div class="col-4"><div class="stat"><strong id="statCorrect">0</strong>Correct</div></div>
          <div class="col-4"><div class="stat"><strong id="statWrong">0</strong>Wrong</div></div>
          <div class="col-4"><div class="stat"><strong id="statPercent">0%</strong>Score</div></div>
        </div>
        <div class="d-grid gap-2 d-sm-flex justify-content-center">
          <button id="reviewBtn" class="btn btn-outline-dark btn-lg" data-bs-toggle="collapse" data-bs-target="#reviewBox">Review answers</button>
          <button id="restartBtn" class="btn btn-accent btn-lg">Play again</button>
        </div>
        <div class="collapse mt-4 text-start" id="reviewBox"><div id="reviewList"></div></div>
      </section>

    </div>
  </div>
</main>

<footer class="text-center text-muted small pb-4">Built with HTML, CSS, JavaScript and Bootstrap</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
